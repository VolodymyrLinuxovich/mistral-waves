<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>Waves — Ukraine heatwave hazard &amp; personal risk</title>
  <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script src="./config.js"></script>
  <style>
    :root{--fg:#16202a;--panel:rgba(255,255,255,.97);--line:#e4e8ec;--accent:#16202a;}
    *{box-sizing:border-box}
    html,body{margin:0;height:100%;font-family:system-ui,-apple-system,sans-serif;color:var(--fg)}
    #map{position:absolute;inset:0}
    .card{background:var(--panel);border-radius:12px;box-shadow:0 6px 24px rgba(0,0,0,.16)}
    #banner{position:absolute;top:0;left:0;right:0;z-index:6;font-size:12.5px;padding:7px 14px;text-align:center;color:#fff;background:#8a4b00}
    #banner.complete{background:#155e2e}#banner.synthetic{background:#5a2b8a}#banner.historical{background:#1d4e6b}
    #disclaimer{position:absolute;bottom:0;left:0;right:0;z-index:6;background:#111a22;color:#e9eef2;font-size:11px;padding:6px 14px;text-align:center}
    #crumbs{position:absolute;top:44px;left:12px;z-index:4;display:flex;gap:6px;align-items:center;background:var(--panel);border-radius:10px;padding:6px 10px;font-size:13px;box-shadow:0 4px 16px rgba(0,0,0,.14)}
    #crumbs a{color:#1d3b57;cursor:pointer}#crumbs a:hover{text-decoration:underline}#crumbs .sep{color:#9aa7b1}#crumbs .cur{font-weight:600}
    #panel{position:absolute;top:88px;left:12px;z-index:3;width:min(370px,94vw);max-height:calc(100vh-190px);overflow:auto;padding:14px 16px}
    h1{font-size:16px;margin:0 0 2px}.muted{color:#5c6b78;font-size:12px}
    .seg{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
    .seg button,select,input{font:inherit;font-size:12px;padding:6px 9px;border:1px solid #cdd4da;border-radius:8px;background:#fff;cursor:pointer}
    .seg button.active{background:var(--accent);color:#fff;border-color:var(--accent)}
    .seg button:focus-visible,input:focus-visible,#crumbs a:focus-visible,.row:focus-visible{outline:3px solid #4a90c2;outline-offset:1px}
    label.blk{display:block;font-size:11px;color:#5c6b78;margin:8px 0 3px;text-transform:uppercase;letter-spacing:.03em}
    input#search{width:100%}
    #headline{font-size:13px;padding:8px 10px;border-radius:8px;background:#f2f5f7;margin:8px 0}
    #headline b{display:block;font-size:14px}
    .list{margin:4px 0 0;border-top:1px solid var(--line)}
    .row{display:flex;justify-content:space-between;gap:8px;padding:7px 0;border-bottom:1px solid var(--line);font-size:13px;cursor:pointer}
    .row:hover{background:#f6f8fa}.row.sel{background:#eaf1f7}
    .row .sub{font-size:11px;color:#5c6b78}
    .lvpill{font-size:11px;padding:1px 7px;border-radius:999px;color:#fff;white-space:nowrap}
    .legend{display:flex;flex-direction:column;gap:3px;font-size:11.5px;margin-top:8px}
    .legend div{display:flex;align-items:center;gap:6px}.legend i{width:14px;height:14px;border-radius:3px;display:inline-block}
    .btn{display:inline-block;background:var(--accent);color:#fff;border:none;border-radius:9px;padding:9px 14px;font-size:13px;cursor:pointer;width:100%;margin-top:10px}
    .btn.sec{background:#eef2f5;color:var(--accent)}
    details>summary{cursor:pointer;font-size:11px;color:#5c6b78;text-transform:uppercase;letter-spacing:.03em;margin:8px 0 3px}
    table{width:100%;border-collapse:collapse;font-size:12px}th,td{text-align:right;padding:3px 4px;border-bottom:1px solid var(--line)}th:first-child,td:first-child{text-align:left}
    .foot{font-size:11px;color:#5c6b78;margin-top:8px}.warnrow{color:#a15c00;font-size:11.5px;margin-top:6px}
    /* timeline */
    #timeline{position:absolute;bottom:26px;left:12px;right:12px;z-index:4;display:flex;gap:8px;align-items:center;background:var(--panel);border-radius:12px;padding:8px 12px;box-shadow:0 4px 16px rgba(0,0,0,.14)}
    #tlbtn{font-size:14px;width:34px;height:34px;border-radius:8px;border:1px solid #cdd4da;background:#fff;cursor:pointer;flex:none}
    #tltrack{flex:1;display:flex;gap:2px;align-items:stretch;height:34px}
    .tlcell{flex:1;border-radius:3px;cursor:pointer;min-width:6px;position:relative}
    .tlcell.sel{outline:2px solid #16202a}
    #tllabel{font-size:12px;min-width:150px;text-align:right}
    #overlay{position:fixed;inset:0;z-index:10;background:rgba(10,15,20,.45);display:none;align-items:flex-start;justify-content:center;overflow:auto;padding:24px 12px}
    #sheet{background:#fff;border-radius:14px;width:min(520px,96vw);padding:18px 20px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
    fieldset{border:1px solid var(--line);border-radius:10px;margin:10px 0;padding:10px 12px}legend{font-size:12px;color:#5c6b78;padding:0 6px}
    .grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px}.chk{font-size:13px;display:flex;align-items:center;gap:6px}
    .emerg{background:#c0161c;color:#fff;padding:14px 16px;border-radius:10px}.emerg b{font-size:17px}
    .reason{font-size:13px;padding:6px 0;border-bottom:1px solid var(--line)}.close{float:right;cursor:pointer;color:#5c6b78;font-size:15px}
    #detail{display:none;position:absolute;bottom:78px;right:12px;z-index:5;width:min(340px,94vw);max-height:52vh;overflow:auto;padding:12px 14px}
    @media(max-width:640px){#crumbs{top:40px;font-size:12px}#panel{top:auto;bottom:78px;left:0;right:0;width:100%;max-height:44vh;border-radius:14px 14px 0 0}#timeline{bottom:26px}#detail{bottom:120px}}
  </style>
</head>
<body>
  <div id="banner" role="status" aria-live="polite"></div>
  <div id="map"></div>
  <div id="disclaimer">⚕ Environmental heat-risk estimate &amp; safety guidance — NOT a medical diagnosis; it does not replace a healthcare professional.</div>
  <nav id="crumbs" aria-label="Breadcrumb"></nav>

  <section id="panel" class="card" aria-label="Context panel">
    <div id="panel-body"></div>
    <label class="blk">Data mode</label>
    <div class="seg" id="modes" role="group" aria-label="Data mode">
      <button data-m="live" class="active">Live forecast</button>
      <button data-m="historical">Historical replay</button>
    </div>
    <div id="mode-extra"></div>
    <div id="headline" role="status" aria-live="polite">Loading…</div>
    <label class="blk" for="search">City search</label>
    <input id="search" placeholder="Type a city (Kyiv, Львів…)" autocomplete="off" role="combobox" aria-expanded="false" aria-autocomplete="list" />
    <div id="searchResults" class="list" role="listbox" aria-label="City results"></div>
    <label class="blk">Layer</label>
    <div class="seg" id="layers" role="group" aria-label="Hazard layer">
      <button data-l="hazard" class="active">Heat hazard</button>
      <button data-l="tx95_exceedance">TX95 exceed</button>
      <button data-l="tx90_exceedance">TX90 exceed</button>
      <button data-l="nighttime">Tropical night</button>
      <button data-l="heat_index">Heat Index</button>
    </div>
    <div id="rank-extra"></div>
    <div class="legend" id="legend" aria-label="Severity legend"></div>
    <details><summary>Developer tools</summary>
      <label class="chk"><input type="checkbox" id="synthetic"/> Synthetic heatwave simulation (not observed/forecast)</label>
    </details>
    <button class="btn" id="openProfile">Check my personal risk →</button>
    <div class="foot" id="src" aria-live="polite">Loading data status…</div>
  </section>

  <div id="detail" class="card"></div>

  <div id="timeline" aria-label="Event timeline">
    <button id="tlbtn" aria-label="Play or pause timeline">▶</button>
    <div id="tltrack" role="slider" aria-label="Date"></div>
    <div id="tllabel" class="muted"></div>
  </div>

  <div id="overlay"><div id="sheet" role="dialog" aria-modal="true" aria-label="Personal risk"></div></div>

  <script>
  (function(){
    "use strict";
    const C=window.WAVES_CONFIG||{};
    const isLocal=location.hostname==="localhost"||location.hostname==="127.0.0.1";
    const API=isLocal?(C.API_BASE||"http://127.0.0.1:8010"):"";
    const LEVELS=["No heatwave","Heatwave watch","Confirmed heatwave","Severe heatwave","Extreme heatwave"];
    const COLORS=["#6b8fa8","#f4c430","#e8862e","#a9481c","#c0161c"];
    const KYIV_BBOX=[30.24,50.21,30.83,50.59];

    const S={level:"national",city:null,region:null,date:null,layer:"hazard",mode:"live",event:null};
    let cityRegistry={}, availableDates=[], summaryData=null, footprintData=null, playing=false, playTimer=null;
    let historicalEvents=[], defaultEvent=null;
    const boundaryCache={}, riskCache={}, fpCache={};
    let fpAbort=null, riskAbort=null, natMarkers=[];

    // ---- map ----
    const style=C.MAPTILER_KEY?`https://api.maptiler.com/maps/dataviz/style.json?key=${C.MAPTILER_KEY}`
      :{version:8,sources:{},layers:[{id:"bg",type:"background",paint:{"background-color":"#dfe7ef"}}]};
    const map=new maplibregl.Map({container:"map",style,center:[31.2,48.8],zoom:5});
    map.addControl(new maplibregl.NavigationControl(),"top-right");
    map.addControl(new maplibregl.AttributionControl({compact:true,customAttribution:"Forecast © Open-Meteo · Climatology ERA5-Land · Boundaries © OSM(ODbL)/geoBoundaries"}));
    let mapReady=false, programmaticMove=false;

    // ---- URL ----
    function writeURL(push){const q=new URLSearchParams();
      if(S.city)q.set("city",S.city); if(S.region)q.set("region",S.region);
      if(S.date)q.set("date",S.date); q.set("layer",S.layer); if(S.mode!=="live")q.set("mode",S.mode);
      if(S.event)q.set("event",S.event);
      const u="?"+q.toString(); push?history.pushState({...S},"",u):history.replaceState({...S},"",u);}
    function readURL(){const q=new URLSearchParams(location.search);
      S.city=q.get("city")||null; S.region=q.get("region")||null; S.date=q.get("date")||null;
      S.layer=q.get("layer")||"hazard"; const m=q.get("mode"); S.mode=["historical","synthetic"].includes(m)?m:"live";
      S.event=q.get("event")||null; S.level=S.region?"district":(S.city?"city":"national");}

    // ---- helpers ----
    const modeParam=()=>S.mode;   // live|historical|synthetic
    function lvpill(l){return `<span class="lvpill" style="background:${COLORS[l]}">Level ${l} · ${LEVELS[l]}</span>`;}
    async function jget(url,signal){const r=await fetch(url,signal?{signal}:undefined); if(!r.ok)throw new Error(r.status); return r.json();}

    // =============== data status / banner ===============
    async function loadStatus(){
      try{const d=await jget(`${API}/api/data-status`); const c=d.providers.climatology_era5_land.detail;
        window.__baseline=c;
        document.getElementById("src").textContent=`Climatology ERA5-Land ${c.baseline_status} · ${c.baseline_year_count||"?"} of ${c.expected_year_count||30} years · Forecast Open-Meteo · not a medical device`;
      }catch(e){document.getElementById("src").textContent="Backend unreachable";}
      renderBanner();
    }
    function renderBanner(){const b=document.getElementById("banner"),c=window.__baseline;
      if(S.mode==="synthetic"){b.className="synthetic";b.textContent="🧪 SYNTHETIC simulation — artificial demonstration data, NOT observed or forecast conditions.";return;}
      if(S.mode==="historical"){b.className="historical";b.textContent="🕓 HISTORICAL replay — observed conditions from ERA5-Land reanalysis"+(S.event?` · ${S.event}`:"");return;}
      if(c&&c.baseline_status==="complete"){b.className="complete";b.textContent="✓ Climatology baseline COMPLETE (1991–2020). Live Open-Meteo forecast.";}
      else{b.className="";const ys=c?c.baseline_years:[2020];b.textContent=`⚠ Provisional climatology: ${c?c.baseline_year_count:1} of ${c?c.expected_year_count:30} years available (${JSON.stringify(ys)}). Results will update as the baseline completes.`;}
    }

    // =============== national footprint + summary ===============
    async function ensureOblasts(){if(map.getSource("oblast-boundaries"))return;
      try{const gj=await jget("/data/boundaries/ukraine_oblasts.geojson");
        map.addSource("oblast-boundaries",{type:"geojson",data:gj});
        map.addLayer({id:"oblast-line",type:"line",source:"oblast-boundaries",paint:{"line-color":"#8aa0b2","line-width":0.8,"line-opacity":0.7}});
      }catch(e){}}
    function fpColorExpr(){
      if(S.layer==="hazard") return ["match",["get","severity_level"],0,COLORS[0],1,COLORS[1],2,COLORS[2],3,COLORS[3],4,COLORS[4],"#9aa7b1"];
      if(S.layer==="nighttime") return ["case",["==",["get","tropical_night"],true],"#c0161c","#6b8fa8"];
      if(S.layer==="heat_index") return ["step",["coalesce",["get","tx95_exceedance"],-99],"#6b8fa8",0,"#f4c430",2,"#e8862e",4,"#c0161c"];
      const key=S.layer==="tx90_exceedance"?"tx90_exceedance":"tx95_exceedance";
      return ["step",["coalesce",["get",key],-99],"#6b8fa8",0,"#f4c430",2,"#e8862e",4,"#c0161c"];
    }
    function fpOpacity(){ return S.layer==="hazard"?["match",["get","severity_level"],0,0.12,0.6]:0.5; }
    async function loadNational({refit=false}={}){
      await ensureOblasts();
      const ev=S.mode==="historical"?`&event_id=${S.event||""}`:"";
      // summary (headline, counts, available_dates)
      try{ summaryData=await jget(`${API}/api/heatwave-summary?date=${S.date}&mode=${modeParam()}${ev}`);
        availableDates=summaryData.available_dates||[]; }catch(e){ summaryData=null; }
      // footprint
      const fkey=`${modeParam()}|${S.date}|${S.event||""}`;
      if(fpAbort)fpAbort.abort(); fpAbort=new AbortController();
      try{ footprintData = fpCache[fkey] || await jget(`${API}/api/heatwave-footprint?date=${S.date}&mode=${modeParam()}${ev}`,fpAbort.signal); fpCache[fkey]=footprintData; }
      catch(e){ if(e.name==="AbortError")return; footprintData=null; }
      if(footprintData){
        if(map.getSource("national-forecast-grid"))map.getSource("national-forecast-grid").setData(footprintData);
        else{ map.addSource("national-forecast-grid",{type:"geojson",data:footprintData});
          map.addLayer({id:"nfg-fill",type:"fill",source:"national-forecast-grid",paint:{"fill-color":fpColorExpr(),"fill-opacity":fpOpacity(),"fill-opacity-transition":{duration:300}}}, map.getLayer("oblast-line")?"oblast-line":undefined);
          map.addLayer({id:"nfg-line",type:"line",source:"national-forecast-grid",paint:{"line-color":"#fff","line-width":0.2,"line-opacity":0.25}}, map.getLayer("oblast-line")?"oblast-line":undefined);
          map.on("click","nfg-fill",(e)=>cellPopup(e.features[0].properties,e.lngLat));
          map.on("mouseenter","nfg-fill",()=>map.getCanvas().style.cursor="pointer");
          map.on("mouseleave","nfg-fill",()=>map.getCanvas().style.cursor="");
        }
        map.setPaintProperty("nfg-fill","fill-color",fpColorExpr());
        map.setPaintProperty("nfg-fill","fill-opacity",fpOpacity());
      }
      await loadCityMarkers();
      renderTimeline();
      renderPanel();
    }
    async function loadCityMarkers(){
      if(S.mode==="historical"){ natMarkers.forEach(m=>m.remove()); natMarkers=[]; window.__natRank=[]; return; }
      if(riskAbort)riskAbort.abort(); riskAbort=new AbortController();
      let d; try{ d=await jget(`${API}/api/risk-map?on=${S.date}&layer=tx95_exceedance&scenario=${S.mode==="synthetic"?"heatwave":""}`,riskAbort.signal);}catch(e){return;}
      natMarkers.forEach(m=>m.remove()); natMarkers=[];
      d.points.filter(p=>!p.error).forEach(p=>{const el=document.createElement("div");
        el.style.cssText=`width:13px;height:13px;border-radius:50%;border:2px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.4);background:${COLORS[p.severity_level||0]};cursor:pointer`;
        el.title=`${p.name_en}: ${p.severity_label}`; el.setAttribute("aria-label",`${p.name_en}, ${p.severity_label}`);
        el.onclick=()=>{ if(cityRegistry[p.city]&&cityRegistry[p.city].has_regions)userActivateCity(p.city); else {flyTo(p.lat,p.lon,9);cellPopupCity(p);} };
        natMarkers.push(new maplibregl.Marker({element:el}).setLngLat([p.lon,p.lat]).addTo(map));});
      window.__natRank=d.points.filter(p=>!p.error);
      if(S.level==="national")renderPanel();
    }
    function setNationalMarkersVisible(v){natMarkers.forEach(m=>m.getElement().style.display=v?"":"none");
      if(map.getLayer("nfg-fill"))map.setPaintProperty("nfg-fill","fill-opacity", v?fpOpacity():0.12);}

    // =============== city / district ===============
    async function loadCityRegions(id){ if(boundaryCache[id])return boundaryCache[id];
      const r=await jget(`${API}/api/city-regions?city=${id}`); if(r.detail)throw new Error(r.detail);
      boundaryCache[id]={geojson:r.geojson,bbox:r.bbox,meta:r,resolution:r.resolution_note}; return boundaryCache[id];}
    async function loadCityRisk(id){ const key=`${id}|${S.date}|${modeParam()}|${(window.__baseline||{}).baseline_status}`;
      if(riskCache[key])return riskCache[key];
      const d=await jget(`${API}/api/city-risk-map?city=${id}&date=${S.date}&layer=hazard&scenario=${S.mode==="synthetic"?"heatwave":""}`);
      riskCache[key]=d.regions; window.__cityMeta=d; return d.regions;}
    async function ensureCityLayers(id){ const b=await loadCityRegions(id);
      if(!map.getSource("kyiv-district-boundaries")){
        map.addSource("kyiv-district-boundaries",{type:"geojson",data:b.geojson});
        map.addLayer({id:"kyiv-district-risk",type:"fill",source:"kyiv-district-boundaries",paint:{"fill-color":"#9aa7b1","fill-opacity":0,"fill-opacity-transition":{duration:400}}});
        map.addLayer({id:"kyiv-district-line",type:"line",source:"kyiv-district-boundaries",paint:{"line-color":"#111","line-width":1.2,"line-opacity":0,"line-opacity-transition":{duration:400}}});
        map.addLayer({id:"selected-region-highlight",type:"line",source:"kyiv-district-boundaries",paint:{"line-color":"#000","line-width":3,"line-opacity":0},filter:["==",["get","id"],"__none__"]});
        map.on("click","kyiv-district-risk",(e)=>userSelectRegion(e.features[0].properties.id));
        map.on("mouseenter","kyiv-district-risk",()=>map.getCanvas().style.cursor="pointer");
        map.on("mouseleave","kyiv-district-risk",()=>map.getCanvas().style.cursor="");
      } else map.getSource("kyiv-district-boundaries").setData(b.geojson);
      return b;}
    async function renderCity(id,{fit}){
      let b; try{b=await ensureCityLayers(id);}catch(e){deactivateCity();return;}
      let regions; try{regions=await loadCityRisk(id);}catch(e){if(e.name==="AbortError")return;regions=[];}
      window.__regions=regions;
      const expr=["match",["get","id"]]; regions.forEach(r=>expr.push(r.id, r.error?"#9aa7b1":COLORS[r.severity_level||0])); expr.push("#9aa7b1");
      map.setPaintProperty("kyiv-district-risk","fill-color",expr);
      map.setPaintProperty("kyiv-district-risk","fill-opacity",0.55);
      map.setPaintProperty("kyiv-district-line","line-opacity",0.9);
      setNationalMarkersVisible(false);              // keep national grid beneath at low opacity
      if(fit&&b.bbox){programmaticMove=true;map.fitBounds([[b.bbox[0],b.bbox[1]],[b.bbox[2],b.bbox[3]]],{padding:50,duration:800});}
      renderPanel(); if(S.region)highlightRegion(S.region);
    }
    function deactivateCity(){["kyiv-district-risk","kyiv-district-line"].forEach(i=>{if(map.getLayer(i))map.setPaintProperty(i,i.endsWith("risk")?"fill-opacity":"line-opacity",0);});
      if(map.getLayer("selected-region-highlight"))map.setPaintProperty("selected-region-highlight","line-opacity",0);
      setNationalMarkersVisible(true);}
    function highlightRegion(id){if(map.getLayer("selected-region-highlight")){map.setFilter("selected-region-highlight",["==",["get","id"],id||"__none__"]);map.setPaintProperty("selected-region-highlight","line-opacity",id?1:0);}}

    // =============== state machine ===============
    function setState(patch,{push=false,fit=false}={}){Object.assign(S,patch);
      S.level=S.region?"district":(S.city?"city":"national"); writeURL(push); apply({fit});}
    async function apply({fit=false}={}){
      if(!S.date)S.date=(availableDates[0]||new Date().toISOString().slice(0,10));
      document.querySelectorAll("#modes button").forEach(x=>x.classList.toggle("active",x.dataset.m===S.mode));
      document.querySelectorAll("#layers button").forEach(x=>x.classList.toggle("active",x.dataset.l===S.layer));
      document.getElementById("synthetic").checked=(S.mode==="synthetic");
      renderBanner(); renderCrumbs(); renderModeExtra();
      await loadNational({});
      if(S.city&&cityRegistry[S.city]&&cityRegistry[S.city].has_regions){ await renderCity(S.city,{fit}); }
      else { deactivateCity(); if(S.city&&fit){const c=cityRegistry[S.city];if(c)flyTo(c.center[0],c.center[1],9);} renderPanel(); }
    }

    // =============== panel / ranking ===============
    function renderCrumbs(){const el=document.getElementById("crumbs");el.innerHTML="";
      const add=(t,fn,cur)=>{if(cur){const s=document.createElement("span");s.className="cur";s.textContent=t;el.appendChild(s);}else{const a=document.createElement("a");a.textContent=t;a.tabIndex=0;a.onclick=fn;a.onkeydown=e=>{if(e.key==="Enter")fn();};el.appendChild(a);}};
      const sep=()=>{const s=document.createElement("span");s.className="sep";s.textContent="/";el.appendChild(s);};
      add("Ukraine",()=>goNational(),S.level==="national");
      if(S.city){sep();add(cityRegistry[S.city]?cityRegistry[S.city].name_en:S.city,()=>setState({region:null},{push:true,fit:true}),S.level==="city");}
      if(S.region){sep();add(regionName(S.region),()=>{},true);}
    }
    function regionName(id){const r=(window.__regions||[]).find(x=>x.id===id);return r?(r.name_en||r.name):id;}
    function renderModeExtra(){const el=document.getElementById("mode-extra");
      if(S.mode!=="historical"){el.innerHTML="";return;}
      const opts=historicalEvents.slice(0,20).map(e=>`<option value="${e.event_id}" ${e.event_id===S.event?"selected":""}>${e.start_date} → ${e.end_date} · L${e.maximum_severity_level} · ${e.duration_days}d · ${e.maximum_temperature}°C</option>`).join("");

    // =============== timeline ===============

    // =============== personal risk (context-aware) ===============

    const g=(id)=>{const el=document.getElementById(id);return el?el.checked:false;};
    let profileCtx=null;
    window.__cityProfile=(rid)=>{const r=(window.__regions||[]).find(x=>x.id===rid);if(!r)return;

    function chk(id,l,c){return `<label class="chk"><input type="checkbox" id="${id}" ${c?"checked":""}/> ${l}</label>`;}

        </div></fieldset>
        <button class="btn" onclick="window.__submitProfile()">See my explained risk →</button>

        <div class="foot">Not a medical diagnosis. Emergency symptoms always trigger an urgent warning.</div>`;};
    window.__closeOverlay=()=>document.getElementById("overlay").style.display="none";
    window.__submitProfile=async function(){const ctx=currentCtx();

    function renderResult(d,ctxLabel){const sheet=document.getElementById("sheet");let h=`<span class="close" onclick="window.__closeOverlay()">✕</span><div class="muted" style="margin-bottom:6px">Environmental context: <b>${ctxLabel}</b></div>`;

        ${d.protective_factors.length?`<h3 style="font-size:13px;margin:12px 0 4px">Protective factors you have</h3><div class="muted">${d.protective_factors.join(", ").replace(/_/g," ")}</div>`:""}`;}
      if(d.guardrails.length)h+=`<h3 style="font-size:13px;margin:12px 0 4px">Important safety notes</h3>`+d.guardrails.map(x=>`<div class="reason" style="color:#a15c00">⚠ ${x.en}</div>`).join("");
      if(d.recommendations.length)h+=`<h3 style="font-size:13px;margin:12px 0 4px">Recommended actions</h3>`+d.recommendations.map(r=>`<div class="reason">✓ ${r.en} <span class="muted">(${r.source_org||"src"}, ${r.source_date||""})</span></div>`).join("");
      h+=`<div class="foot">${d.disclaimer_en} · rule engine v${d.rule_engine_version}</div><button class="btn sec" onclick="window.openProfile()">Edit profile</button>`;sheet.innerHTML=h;}
    document.getElementById("openProfile").onclick=()=>{profileCtx=null;if(S.region)window.__cityProfile(S.region);else openProfile();};

    // =============== boot ===============
    map.on("load",async()=>{ readURL();
      try{const av=await jget(`${API}/api/cities-available`);av.cities.forEach(c=>cityRegistry[c.id]=c);}catch(e){}
      await loadStatus();
      if(S.mode==="historical"){ await loadHistoricalEvents(); if(!S.event)S.event=defaultEvent;
        if(S.event){try{const det=await jget(`${API}/api/historical-event/${S.event}`);window.__tlLevels={};det.timeline.forEach(t=>window.__tlLevels[t.date]=t.max_level);availableDates=det.dates;if(!S.date)S.date=det.dates[0];}catch(e){}} }
      mapReady=true;
      window.__waves={getState:()=>({...S}),regions:()=>(window.__regions||[]),ready:true,
        mapCount:()=>document.querySelectorAll(".maplibregl-canvas").length,summary:()=>summaryData};
      await apply({fit:!!S.city});
    });
  })();
  </script>
</body>
</html>
