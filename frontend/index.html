<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>Waves — Ukraine heatwave hazard &amp; personal risk</title>
  <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script src="./config.js"></script>
  <style>
    :root{--fg:#16202a;--panel:rgba(255,255,255,.97);--line:#dce3e8;--accent:#16202a;--focus:#2b78ad;}
    *{box-sizing:border-box}
    html,body{margin:0;height:100%;font-family:system-ui,-apple-system,sans-serif;color:var(--fg)}
    body{height:100dvh;overflow:hidden;display:grid;grid-template-rows:auto minmax(0,1fr) auto;background:#eef2f5}
    button,select,input{font:inherit}
    #workspace{min-width:0;min-height:0;display:grid;grid-template-columns:minmax(290px,340px) minmax(0,1fr);overflow:hidden}
    #map-region{position:relative;min-width:0;min-height:0;overflow:hidden}
    #map{position:absolute;inset:0}
    .card{background:var(--panel);border-radius:12px;box-shadow:0 6px 24px rgba(0,0,0,.16)}
    #banner{z-index:6;font-size:12.5px;line-height:1.35;padding:7px 14px;text-align:center;color:#fff;background:#8a4b00}
    #banner.complete{background:#155e2e}#banner.synthetic{background:#5a2b8a}#banner.historical{background:#1d4e6b}
    #disclaimer{z-index:6;background:#111a22;color:#e9eef2;font-size:11px;line-height:1.35;padding:6px 14px;text-align:center}
    #crumbs{position:absolute;top:12px;left:12px;z-index:4;display:flex;gap:6px;align-items:center;background:var(--panel);border-radius:10px;padding:6px 10px;font-size:13px;box-shadow:0 4px 16px rgba(0,0,0,.14)}
    #crumbs a{color:#1d3b57;cursor:pointer}#crumbs a:hover{text-decoration:underline}#crumbs .sep{color:#9aa7b1}#crumbs .cur{font-weight:600}
    #panel{position:relative;z-index:3;min-width:0;min-height:0;overflow-y:auto;padding:15px 16px 12px;border-right:1px solid var(--line);border-radius:0;box-shadow:4px 0 18px rgba(28,45,58,.09);scrollbar-gutter:stable}
    h1{font-size:16px;margin:0 0 2px}.muted{color:#5c6b78;font-size:12px}
    .seg{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
    .seg button,select,input{font-size:12px;padding:6px 9px;border:1px solid #c4ced6;border-radius:8px;background:#fff;cursor:pointer}
    .seg button.active{background:var(--accent);color:#fff;border-color:var(--accent)}
    button:focus-visible,select:focus-visible,input:focus-visible,#crumbs a:focus-visible,.row:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
    label.blk{display:block;font-size:11px;color:#5c6b78;margin:8px 0 3px;text-transform:uppercase;letter-spacing:.03em}
    input#search{width:100%}
    #headline{font-size:13px;padding:8px 10px;border-radius:8px;background:#f2f5f7;margin:8px 0}
    #headline b{display:block;font-size:14px}
    .list{margin:4px 0 0;border-top:1px solid var(--line)}
    #ranklist{max-height:23vh;overflow-y:auto;overscroll-behavior:contain}
    .row{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:54px;padding:7px 8px;border-bottom:1px solid var(--line);border-left:3px solid transparent;font-size:13px;cursor:pointer}
    .row:hover{background:#f3f6f8}.row.sel{background:#e2edf5;border-left-color:#245d85}.row>div:first-child{min-width:0}.row>div:first-child>div:first-child{font-weight:650}
    .row .sub{font-size:11px;color:#5c6b78}
    .lvpill{font-size:11px;font-weight:700;padding:2px 7px;border-radius:999px;color:#fff;white-space:nowrap}
    .legend{display:flex;flex-direction:column;gap:3px;font-size:11.5px;margin-top:8px}
    .legend div{display:flex;align-items:center;gap:6px}.legend i{width:14px;height:14px;border-radius:3px;display:inline-block}
    .btn{display:inline-block;background:var(--accent);color:#fff;border:none;border-radius:9px;padding:9px 14px;font-size:13px;cursor:pointer;width:100%;margin-top:10px}
    #openProfile{position:sticky;bottom:0;z-index:2;min-height:44px;box-shadow:0 -8px 14px rgba(255,255,255,.94);margin-bottom:2px}
    .btn.sec{background:#eef2f5;color:var(--accent)}
    details>summary{cursor:pointer;font-size:11px;color:#5c6b78;text-transform:uppercase;letter-spacing:.03em;margin:8px 0 3px}
    table{width:100%;border-collapse:collapse;font-size:12px}th,td{text-align:right;padding:3px 4px;border-bottom:1px solid var(--line)}th:first-child,td:first-child{text-align:left}
    .foot{font-size:11px;color:#5c6b78;margin-top:8px}.warnrow{color:#a15c00;font-size:11.5px;margin-top:6px}
    /* Bottom-docked, video-player-style timeline (map column only). */
    #timeline{--progress:0%;position:absolute;bottom:12px;left:12px;right:12px;z-index:4;display:grid;grid-template-columns:auto minmax(116px,auto) minmax(150px,1fr) auto auto;grid-template-areas:"buttons current range end speed" "buttons status status status speed";column-gap:12px;row-gap:4px;align-items:center;background:rgba(255,255,255,.97);border:1px solid rgba(205,215,222,.9);border-radius:15px;padding:11px 14px;box-shadow:0 8px 28px rgba(19,36,49,.22);backdrop-filter:blur(10px)}
    .tlbuttons{grid-area:buttons;display:flex;align-items:center;gap:6px}
    .tlbutton{display:grid;place-items:center;width:44px;height:44px;padding:0;border:1px solid #c7d1d9;border-radius:50%;background:#fff;color:#182631;font-size:17px;line-height:1;cursor:pointer}
    #tlbtn{background:var(--accent);border-color:var(--accent);color:#fff;font-size:16px;box-shadow:0 3px 9px rgba(22,32,42,.24)}
    .tldate{grid-area:current;min-width:0}.tldate strong{display:block;font-size:13px;line-height:1.2}.tldate span{display:block;font-size:10px;line-height:1.25;color:#60717e;text-transform:uppercase;letter-spacing:.04em}
    .tlrange-wrap{grid-area:range;position:relative;display:flex;align-items:center;min-width:0;height:30px}
    #tlrange{-webkit-appearance:none;appearance:none;width:100%;height:30px;margin:0;padding:0;border:0;border-radius:0;background:transparent;cursor:pointer;accent-color:#a9481c}
    #tlrange::-webkit-slider-runnable-track{height:6px;border-radius:999px;background:linear-gradient(to right,#a9481c 0 var(--progress),#d6dee4 var(--progress) 100%)}
    #tlrange::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;margin-top:-6px;border:3px solid #fff;border-radius:50%;background:#a9481c;box-shadow:0 0 0 1px #873713,0 2px 5px rgba(0,0,0,.25)}
    #tlrange::-moz-range-track{height:6px;border-radius:999px;background:linear-gradient(to right,#a9481c 0 var(--progress),#d6dee4 var(--progress) 100%)}
    #tlrange::-moz-range-thumb{width:14px;height:14px;border:3px solid #fff;border-radius:50%;background:#a9481c;box-shadow:0 0 0 1px #873713,0 2px 5px rgba(0,0,0,.25)}
    #tlmarkers{position:absolute;left:9px;right:9px;top:4px;height:5px;pointer-events:none}.tlmarker{position:absolute;width:5px;height:5px;border-radius:50%;transform:translateX(-50%);box-shadow:0 0 0 1px rgba(255,255,255,.8)}
    #tlend{grid-area:end;white-space:nowrap;font-size:11px;color:#526472}
    .tlspeed{grid-area:speed;display:flex;align-items:center;gap:5px;font-size:10px;color:#60717e;text-transform:uppercase;letter-spacing:.04em}.tlspeed select{min-width:63px;height:34px;padding:4px 7px;color:var(--fg);text-transform:none}
    #tlstatus{grid-area:status;min-width:0;font-size:11.5px;color:#526472;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    #timeline[data-playing="true"] #tlbtn{background:#a9481c;border-color:#a9481c}
    #overlay{position:fixed;inset:0;z-index:10;background:rgba(10,15,20,.45);display:none;align-items:flex-start;justify-content:center;overflow:auto;padding:24px 12px}
    #sheet{background:#fff;border-radius:14px;width:min(520px,96vw);padding:18px 20px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
    fieldset{border:1px solid var(--line);border-radius:10px;margin:10px 0;padding:10px 12px}legend{font-size:12px;color:#5c6b78;padding:0 6px}
    .grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px}.chk{font-size:13px;display:flex;align-items:center;gap:6px}
    .emerg{background:#c0161c;color:#fff;padding:14px 16px;border-radius:10px}.emerg b{font-size:17px}
    .reason{font-size:13px;padding:6px 0;border-bottom:1px solid var(--line)}.close{float:right;cursor:pointer;color:#5c6b78;font-size:15px}
    .mistral-cta{margin-top:12px;padding-top:10px;border-top:1px solid var(--line)}.mistral-row{display:flex;align-items:end;gap:8px}.mistral-row label{flex:0 0 145px}.mistral-row .btn{flex:1;width:auto;margin-top:0;background:#e2681c}.mistral-row .btn:disabled{cursor:wait;opacity:.7}.mistral-plan{margin-top:12px;padding:12px;border:1px solid #efc29f;border-radius:10px;background:#fff8f2}.mistral-plan h2{font-size:15px;margin:0 0 2px}.mistral-plan h3{font-size:12px;margin:11px 0 2px;text-transform:uppercase;letter-spacing:.03em}.mistral-plan ul{margin:4px 0 0;padding-left:20px}.mistral-plan li{font-size:13px;margin:4px 0}.check-in{font-size:13px;padding:9px;border-radius:8px;background:#fff;border:1px solid var(--line);white-space:pre-wrap}.copy-btn{width:auto;margin-top:6px;padding:6px 10px}.mistral-error{margin-top:10px;padding:9px;border-radius:8px;background:#fff4e8;color:#8a4b00;font-size:12px}.family-checkin{margin-top:12px;padding-top:10px;border-top:1px solid #efc29f}.sms-btn{background:#245d85!important}.checkin-card{margin-top:9px;padding:11px;border-radius:9px;font-size:13px;font-weight:650}.checkin-card.pending{background:#eef2f5;color:#44515d}.checkin-card.ok{background:#e4f4e9;color:#155e2e}.checkin-card.help{background:#fde8e7;color:#9f1d16}.checkin-card.error{background:#fff4e8;color:#8a4b00}
    #detail{display:none;position:absolute;bottom:118px;right:12px;z-index:5;width:min(340px,94vw);max-height:52%;overflow:auto;padding:12px 14px}
    @media(max-width:900px) and (min-width:641px){#workspace{grid-template-columns:minmax(280px,310px) minmax(0,1fr)}#timeline{grid-template-columns:auto minmax(100px,auto) minmax(120px,1fr) auto;grid-template-areas:"buttons current range speed" "buttons status end speed"}#tlend{text-align:right}}
    @media(max-width:640px){
      body{grid-template-rows:auto minmax(0,1fr) auto}
      #workspace{display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(230px,1fr) minmax(190px,40vh);overflow:hidden}
      #map-region{grid-row:1}
      #panel{grid-row:2;border:0;border-top:1px solid var(--line);border-radius:16px 16px 0 0;box-shadow:0 -8px 24px rgba(20,36,48,.16);padding:12px 14px 10px}
      #crumbs{top:8px;left:8px;max-width:calc(100% - 68px);font-size:12px;overflow:hidden;white-space:nowrap}
      #timeline{bottom:8px;left:8px;right:8px;grid-template-columns:auto minmax(0,1fr) auto;grid-template-areas:"buttons current speed" "range range range" "status status end";gap:6px 9px;padding:9px 10px}
      .tlbuttons{gap:4px}.tlbutton{width:44px;height:44px}
      .tldate strong{font-size:12px}.tldate span{font-size:9px}
      .tlspeed{justify-self:end}.tlspeed>span{display:none}.tlspeed select{min-width:57px;height:36px}
      .tlrange-wrap{height:26px}#tlrange{height:26px}#tlstatus{font-size:10.5px}#tlend{font-size:10px}
      #detail{bottom:138px;right:8px;max-height:58%;width:calc(100% - 16px)}
      #ranklist{max-height:18vh}
      #banner{font-size:11px;padding:5px 8px}#disclaimer{font-size:10px;padding:5px 8px}
    }
  </style>
</head>
<body>
  <div id="banner" role="status" aria-live="polite"></div>
  <main id="workspace">
    <section id="panel" aria-label="Context panel">
      <div id="panel-body"></div>
      <label class="blk">Data mode</label>
      <div class="seg" id="modes" role="group" aria-label="Data mode">
        <button data-m="live" class="active">Live forecast</button>
        <button data-m="historical">Historical replay</button>
      </div>
      <div id="mode-extra"></div>
      <div id="headline" role="status" aria-live="polite">Loading…</div>
      <label class="blk" for="search">City search</label>
      <input id="search" placeholder="Type a city (Kyiv, Львів…)" autocomplete="off" role="combobox" aria-expanded="false" aria-autocomplete="list" />
      <div id="searchResults" class="list" role="listbox" aria-label="City results"></div>
      <label class="blk">Layer</label>
      <div class="seg" id="layers" role="group" aria-label="Hazard layer">
        <button data-l="hazard" class="active">Heat hazard</button>
        <button data-l="tx95_exceedance">TX95 exceed</button>
        <button data-l="tx90_exceedance">TX90 exceed</button>
        <button data-l="nighttime">Tropical night</button>
        <button data-l="heat_index">Heat Index</button>
      </div>
      <div id="rank-extra"></div>
      <div class="legend" id="legend" aria-label="Severity legend"></div>
      <details><summary>Developer tools</summary>
        <label class="chk"><input type="checkbox" id="synthetic"/> Synthetic heatwave simulation (not observed/forecast)</label>
      </details>
      <button class="btn" id="openProfile">Check my personal risk →</button>
      <div class="foot" id="src" aria-live="polite">Loading data status…</div>
    </section>

    <section id="map-region" aria-label="Heat hazard map">
      <div id="map"></div>
      <nav id="crumbs" aria-label="Breadcrumb"></nav>
      <div id="detail" class="card"></div>
      <div id="timeline" role="region" aria-label="Forecast timeline" data-playing="false">
        <div class="tlbuttons">
          <button class="tlbutton" id="tlprev" type="button" aria-label="Previous date">‹</button>
          <button class="tlbutton" id="tlbtn" type="button" aria-label="Play timeline" aria-pressed="false">▶</button>
          <button class="tlbutton" id="tlnext" type="button" aria-label="Next date">›</button>
        </div>
        <div class="tldate"><span id="tlkind">Forecast date</span><strong id="tlcurrent">Loading…</strong></div>
        <div class="tlrange-wrap">
          <input id="tlrange" type="range" min="0" max="0" step="1" value="0" aria-label="Forecast date" />
          <div id="tlmarkers" aria-hidden="true"></div>
        </div>
        <div id="tlend"></div>
        <label class="tlspeed" for="tlspeed"><span>Speed</span><select id="tlspeed" aria-label="Playback speed"><option value="0.5">0.5x</option><option value="1" selected>1x</option><option value="2">2x</option></select></label>
        <div id="tlstatus" aria-live="polite"></div>
      </div>
    </section>
  </main>
  <div id="disclaimer">⚕ Environmental heat-risk estimate &amp; safety guidance — NOT a medical diagnosis; it does not replace a healthcare professional.</div>

  <div id="overlay"><div id="sheet" role="dialog" aria-modal="true" aria-label="Personal risk"></div></div>

  <script>
  (function(){
    "use strict";
    const C=window.WAVES_CONFIG||{};
    const isLocal=location.hostname==="localhost"||location.hostname==="127.0.0.1";
    const API=isLocal?(C.API_BASE||"http://127.0.0.1:8010"):"";
    const LEVELS=["No heatwave","Heatwave watch","Confirmed heatwave","Severe heatwave","Extreme heatwave"];
    const COLORS=["#6b8fa8","#f4c430","#e8862e","#a9481c","#c0161c"];
    const KYIV_BBOX=[30.24,50.21,30.83,50.59];

    const S={level:"national",city:null,region:null,date:null,layer:"hazard",mode:"live",event:null};
    let cityRegistry={}, availableDates=[], summaryData=null, footprintData=null, playing=false, playTimer=null, playbackRate=1;
    let historicalEvents=[], defaultEvent=null;
    const boundaryCache={}, riskCache={}, fpCache={};
    let fpAbort=null, riskAbort=null, natMarkers=[];
    let cityRiskError=null, districtGeoJSON=null;

    // ---- map ----
    const style=C.MAPTILER_KEY?`https://api.maptiler.com/maps/dataviz/style.json?key=${C.MAPTILER_KEY}`
      :{version:8,sources:{},layers:[{id:"bg",type:"background",paint:{"background-color":"#dfe7ef"}}]};
    const map=new maplibregl.Map({container:"map",style,center:[31.2,48.8],zoom:5});
    map.addControl(new maplibregl.NavigationControl(),"top-right");
    map.addControl(new maplibregl.AttributionControl({compact:true,customAttribution:"Forecast © Open-Meteo · Climatology ERA5-Land · Boundaries © OSM(ODbL)/geoBoundaries"}));
    let mapReady=false, programmaticMove=false;
    let resizeFrame=null;
    function resizeMap(){cancelAnimationFrame(resizeFrame);resizeFrame=requestAnimationFrame(()=>map.resize());}
    if("ResizeObserver" in window)new ResizeObserver(resizeMap).observe(document.getElementById("map-region"));
    window.addEventListener("resize",resizeMap,{passive:true});

    // ---- URL ----
    function writeURL(push){const q=new URLSearchParams();
      if(S.city)q.set("city",S.city); if(S.region)q.set("region",S.region);
      if(S.date)q.set("date",S.date); q.set("layer",S.layer); if(S.mode!=="live")q.set("mode",S.mode);
      if(S.event)q.set("event",S.event);
      const u="?"+q.toString(); push?history.pushState({...S},"",u):history.replaceState({...S},"",u);}
    function readURL(){const q=new URLSearchParams(location.search);
      S.city=q.get("city")||null; S.region=q.get("region")||null; S.date=q.get("date")||null;
      S.layer=q.get("layer")||"hazard"; const m=q.get("mode"); S.mode=["historical","synthetic"].includes(m)?m:"live";
      S.event=q.get("event")||null; S.level=S.region?"district":(S.city?"city":"national");}

    // ---- helpers ----
    const modeParam=()=>S.mode;   // live|historical|synthetic
    function lvpill(l,compact=false){return `<span class="lvpill" style="background:${COLORS[l]}" title="Level ${l} · ${LEVELS[l]}">${compact?`L${l}`:`Level ${l} · ${LEVELS[l]}`}</span>`;}
    async function jget(url,signal){const r=await fetch(url,signal?{signal}:undefined); if(!r.ok)throw new Error(r.status); return r.json();}

    // =============== data status / banner ===============
    async function loadStatus(){
      try{const d=await jget(`${API}/api/data-status`); const c=d.providers.climatology_era5_land.detail;
        window.__baseline=c;
        document.getElementById("src").textContent=`Climatology ERA5-Land ${c.baseline_status} · ${c.baseline_year_count||"?"} of ${c.expected_year_count||30} years · Forecast Open-Meteo · not a medical device`;
      }catch(e){document.getElementById("src").textContent="Backend unreachable";}
      renderBanner();
    }
    function renderBanner(){const b=document.getElementById("banner"),c=window.__baseline;
      if(S.mode==="synthetic"){b.className="synthetic";b.textContent="🧪 SYNTHETIC simulation — artificial demonstration data, NOT observed or forecast conditions.";return;}
      if(S.mode==="historical"){b.className="historical";b.textContent="🕓 HISTORICAL replay — observed conditions from ERA5-Land reanalysis"+(S.event?` · ${S.event}`:"");return;}
      if(c&&c.baseline_status==="complete"){b.className="complete";b.textContent="✓ Climatology baseline COMPLETE (1991–2020). Live Open-Meteo forecast.";}
      else{b.className="";const ys=c?c.baseline_years:[2020];b.textContent=`⚠ Provisional climatology: ${c?c.baseline_year_count:1} of ${c?c.expected_year_count:30} years available (${JSON.stringify(ys)}). Results will update as the baseline completes.`;}
    }

    // =============== national footprint + summary ===============
    async function ensureOblasts(){if(map.getSource("oblast-boundaries"))return;
      try{const gj=await jget("/data/boundaries/ukraine_oblasts.geojson");
        map.addSource("oblast-boundaries",{type:"geojson",data:gj});
        map.addLayer({id:"oblast-line",type:"line",source:"oblast-boundaries",paint:{"line-color":"#8aa0b2","line-width":0.8,"line-opacity":0.7}});
      }catch(e){}}
    function severityColorExpr(){return ["match",["get","severity_level"],0,COLORS[0],1,COLORS[1],2,COLORS[2],3,COLORS[3],4,COLORS[4],"#9aa7b1"];}
    function fpColorExpr(){
      if(S.layer==="hazard") return severityColorExpr();
      if(S.layer==="nighttime") return ["case",["==",["get","tropical_night"],true],"#c0161c","#6b8fa8"];
      if(S.layer==="heat_index") return ["step",["coalesce",["get","tx95_exceedance"],-99],"#6b8fa8",0,"#f4c430",2,"#e8862e",4,"#c0161c"];
      const key=S.layer==="tx90_exceedance"?"tx90_exceedance":"tx95_exceedance";
      return ["step",["coalesce",["get",key],-99],"#6b8fa8",0,"#f4c430",2,"#e8862e",4,"#c0161c"];
    }
    function fpOpacity(){ return S.layer==="hazard"?["match",["get","severity_level"],0,0.12,0.6]:0.5; }
    async function loadNational({refit=false}={}){
      await ensureOblasts();
      const ev=S.mode==="historical"?`&event_id=${S.event||""}`:"";
      // summary (headline, counts, available_dates)
      try{ summaryData=await jget(`${API}/api/heatwave-summary?date=${S.date}&mode=${modeParam()}${ev}`);
        availableDates=summaryData.available_dates||[];
        if(availableDates.length&&!availableDates.includes(S.date)){
          S.date=availableDates[0]; writeURL(false);
          summaryData=await jget(`${API}/api/heatwave-summary?date=${S.date}&mode=${modeParam()}${ev}`);
          availableDates=summaryData.available_dates||availableDates;
        }
      }catch(e){ summaryData=null; }
      // footprint
      const fkey=`${modeParam()}|${S.date}|${S.event||""}`;
      if(fpAbort)fpAbort.abort(); fpAbort=new AbortController();
      try{ footprintData = fpCache[fkey] || await jget(`${API}/api/heatwave-footprint?date=${S.date}&mode=${modeParam()}${ev}`,fpAbort.signal); fpCache[fkey]=footprintData; }
      catch(e){ if(e.name==="AbortError")return; footprintData=null; }
      if(footprintData){
        if(map.getSource("national-forecast-grid"))map.getSource("national-forecast-grid").setData(footprintData);
        else{ map.addSource("national-forecast-grid",{type:"geojson",data:footprintData});
          map.addLayer({id:"nfg-fill",type:"fill",source:"national-forecast-grid",paint:{"fill-color":fpColorExpr(),"fill-opacity":fpOpacity(),"fill-opacity-transition":{duration:300}}}, map.getLayer("oblast-line")?"oblast-line":undefined);
          map.addLayer({id:"nfg-line",type:"line",source:"national-forecast-grid",paint:{"line-color":"#fff","line-width":0.2,"line-opacity":0.25}}, map.getLayer("oblast-line")?"oblast-line":undefined);
          map.on("click","nfg-fill",(e)=>cellPopup(e.features[0].properties,e.lngLat));
          map.on("mouseenter","nfg-fill",()=>map.getCanvas().style.cursor="pointer");
          map.on("mouseleave","nfg-fill",()=>map.getCanvas().style.cursor="");
        }
        map.setPaintProperty("nfg-fill","fill-color",fpColorExpr());
        map.setPaintProperty("nfg-fill","fill-opacity",fpOpacity());
      }
      await loadCityMarkers();
      renderTimeline();
      renderPanel();
    }
    async function loadCityMarkers(){
      if(S.mode==="historical"){ natMarkers.forEach(m=>m.remove()); natMarkers=[]; window.__natRank=[]; return; }
      if(riskAbort)riskAbort.abort(); riskAbort=new AbortController();
      let d; try{ d=await jget(`${API}/api/risk-map?on=${S.date}&layer=tx95_exceedance&scenario=${S.mode==="synthetic"?"heatwave":""}`,riskAbort.signal);}catch(e){return;}
      natMarkers.forEach(m=>m.remove()); natMarkers=[];
      d.points.filter(p=>!p.error).forEach(p=>{const el=document.createElement("div");
        el.style.cssText=`width:13px;height:13px;border-radius:50%;border:2px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.4);background:${COLORS[p.severity_level||0]};cursor:pointer`;
        el.title=`${p.name_en}: ${p.severity_label}`; el.setAttribute("aria-label",`${p.name_en}, ${p.severity_label}`);
        el.onclick=()=>{ if(cityRegistry[p.city]&&cityRegistry[p.city].has_regions)userActivateCity(p.city); else {flyTo(p.lat,p.lon,9);cellPopupCity(p);} };
        natMarkers.push(new maplibregl.Marker({element:el}).setLngLat([p.lon,p.lat]).addTo(map));});
      window.__natRank=d.points.filter(p=>!p.error);
      if(S.level==="national")renderPanel();
    }
    function setNationalMarkersVisible(v){natMarkers.forEach(m=>m.getElement().style.display=v?"":"none");
      if(map.getLayer("nfg-fill"))map.setPaintProperty("nfg-fill","fill-opacity", v?fpOpacity():0.12);}

    // =============== city / district ===============
    async function loadCityRegions(id){ if(boundaryCache[id])return boundaryCache[id];
      const r=await jget(`${API}/api/city-regions?city=${id}`); if(r.detail)throw new Error(r.detail);
      boundaryCache[id]={geojson:r.geojson,bbox:r.bbox,meta:r,resolution:r.resolution_note}; return boundaryCache[id];}
    async function loadCityRisk(id,on){ const key=`${id}|${on}|${modeParam()}|${(window.__baseline||{}).baseline_status}`;
      const d=riskCache[key]||await jget(`${API}/api/city-risk-map?city=${id}&date=${on}&layer=hazard&scenario=${S.mode==="synthetic"?"heatwave":""}`);
      riskCache[key]=d; return d;}
    async function ensureCityLayers(id){ const b=await loadCityRegions(id);
      if(!map.getSource("kyiv-district-boundaries")){
        map.addSource("kyiv-district-boundaries",{type:"geojson",data:b.geojson});
        map.addLayer({id:"kyiv-district-risk",type:"fill",source:"kyiv-district-boundaries",paint:{"fill-color":"#9aa7b1","fill-opacity":0,"fill-opacity-transition":{duration:400}}});
        map.addLayer({id:"kyiv-district-line",type:"line",source:"kyiv-district-boundaries",paint:{"line-color":"#111","line-width":1.2,"line-opacity":0,"line-opacity-transition":{duration:400}}});
        map.addLayer({id:"selected-region-highlight",type:"line",source:"kyiv-district-boundaries",paint:{"line-color":"#000","line-width":3,"line-opacity":0},filter:["==",["get","id"],"__none__"]});
        map.on("click","kyiv-district-risk",(e)=>userSelectRegion(e.features[0].properties.id));
        map.on("mouseenter","kyiv-district-risk",()=>map.getCanvas().style.cursor="pointer");
        map.on("mouseleave","kyiv-district-risk",()=>map.getCanvas().style.cursor="");
      } else map.getSource("kyiv-district-boundaries").setData(b.geojson);
      return b;}
    function districtRiskData(boundaries,regions){const byId=new Map(regions.map(r=>[r.id,r]));
      return {...boundaries,features:boundaries.features.map(f=>{const r=byId.get(f.properties.id),level=r?.severity_level;
        return {...f,properties:{...f.properties,severity_level:level,severity_color:Number.isInteger(level)?COLORS[level]:null,forecast_status:r&&!r.error?"loaded":"unavailable"}};})};}
    async function renderCity(id,{fit,date:selectedDate}){
      let b; try{b=await ensureCityLayers(id);}catch(e){deactivateCity();return;}
      let data; try{data=await loadCityRisk(id,selectedDate);}catch(e){if(e.name==="AbortError")return;cityRiskError=e;data=null;}
      if(selectedDate!==S.date||id!==S.city)return;
      const regions=(data?.regions||[]).filter(r=>!r.error);
      if(!regions.length){cityRiskError=cityRiskError||new Error("district forecast unavailable");window.__cityMeta=null;window.__regions=[];districtGeoJSON=null;
        map.setPaintProperty("kyiv-district-risk","fill-opacity",0);map.setPaintProperty("kyiv-district-line","line-opacity",0);
        document.getElementById("detail").style.display="none";
      }else{cityRiskError=null;window.__cityMeta=data;window.__regions=regions;
        districtGeoJSON=districtRiskData(b.geojson,regions);map.getSource("kyiv-district-boundaries").setData(districtGeoJSON);
        map.setPaintProperty("kyiv-district-risk","fill-color",severityColorExpr());
        map.setPaintProperty("kyiv-district-risk","fill-opacity",0.55);
        map.setPaintProperty("kyiv-district-line","line-opacity",0.9);}
      setNationalMarkersVisible(false);              // keep national grid beneath at low opacity
      if(fit&&b.bbox){programmaticMove=true;map.fitBounds([[b.bbox[0],b.bbox[1]],[b.bbox[2],b.bbox[3]]],{padding:50,duration:800});}
      renderPanel(); if(S.region)highlightRegion(S.region);
    }
    function deactivateCity(){["kyiv-district-risk","kyiv-district-line"].forEach(i=>{if(map.getLayer(i))map.setPaintProperty(i,i.endsWith("risk")?"fill-opacity":"line-opacity",0);});
      if(map.getLayer("selected-region-highlight"))map.setPaintProperty("selected-region-highlight","line-opacity",0);
      setNationalMarkersVisible(true);}
    function highlightRegion(id){if(map.getLayer("selected-region-highlight")){map.setFilter("selected-region-highlight",["==",["get","id"],id||"__none__"]);map.setPaintProperty("selected-region-highlight","line-opacity",id?1:0);}}

    // =============== state machine ===============
    function setState(patch,{push=false,fit=false}={}){Object.assign(S,patch);
      S.level=S.region?"district":(S.city?"city":"national"); writeURL(push); return apply({fit});}
    async function apply({fit=false}={}){
      if(!S.date)S.date=(availableDates[0]||new Date().toISOString().slice(0,10));
      document.querySelectorAll("#modes button").forEach(x=>x.classList.toggle("active",x.dataset.m===S.mode));
      document.querySelectorAll("#layers button").forEach(x=>x.classList.toggle("active",x.dataset.l===S.layer));
      document.getElementById("synthetic").checked=(S.mode==="synthetic");
      renderBanner(); renderCrumbs(); renderModeExtra();
      await loadNational({});
      if(S.city&&cityRegistry[S.city]&&cityRegistry[S.city].has_regions){ const selectedDate=S.date;await renderCity(S.city,{fit,date:selectedDate}); }
      else { deactivateCity(); if(S.city&&fit){const c=cityRegistry[S.city];if(c)flyTo(c.center[0],c.center[1],9);} renderPanel(); }
    }

    // =============== panel / ranking ===============
    function renderCrumbs(){const el=document.getElementById("crumbs");el.innerHTML="";
      const add=(t,fn,cur)=>{if(cur){const s=document.createElement("span");s.className="cur";s.textContent=t;el.appendChild(s);}else{const a=document.createElement("a");a.textContent=t;a.tabIndex=0;a.onclick=fn;a.onkeydown=e=>{if(e.key==="Enter")fn();};el.appendChild(a);}};
      const sep=()=>{const s=document.createElement("span");s.className="sep";s.textContent="/";el.appendChild(s);};
      add("Ukraine",()=>goNational(),S.level==="national");
      if(S.city){sep();add(cityRegistry[S.city]?cityRegistry[S.city].name_en:S.city,()=>setState({region:null},{push:true,fit:true}),S.level==="city");}
      if(S.region){sep();add(regionName(S.region),()=>{},true);}
    }
    function regionName(id){const r=(window.__regions||[]).find(x=>x.id===id);return r?(r.name_en||r.name):id;}
    function renderModeExtra(){const el=document.getElementById("mode-extra");
      if(S.mode!=="historical"){el.innerHTML="";return;}
      const opts=historicalEvents.slice(0,20).map(e=>`<option value="${e.event_id}" ${e.event_id===S.event?"selected":""}>${e.start_date} → ${e.end_date} · L${e.maximum_severity_level} · ${e.duration_days}d · ${e.maximum_temperature}°C</option>`).join("");
      el.innerHTML=`<label class="blk" for="evsel">Observed event (ERA5-Land)</label><select id="evsel" style="width:100%">${opts}</select>`;
      const sel=document.getElementById("evsel"); if(sel)sel.onchange=()=>selectEvent(sel.value);
    }
    function renderPanel(){
      const body=document.getElementById("panel-body"), rank=document.getElementById("rank-extra"), hl=document.getElementById("headline");
      renderLegend();
      // headline (no-event / watch / confirmed)
      if(S.level!=="national"&&cityRiskError){hl.style.background="#f6ddd6";hl.textContent="Forecast data could not be loaded.";}
      else if(summaryData){ const st=summaryData.status;
        hl.style.background = st==="no_event"?"#e8f0f4":st==="watch"?"#fbf2d6":"#f6ddd6";
        hl.innerHTML=`<b>${summaryData.headline}</b>`+
          `<span class="muted">Levels — watch ${summaryData.counts_by_level?.["1"]||0}, confirmed ${summaryData.counts_by_level?.["2"]||0}, severe ${summaryData.counts_by_level?.["3"]||0}, extreme ${summaryData.counts_by_level?.["4"]||0}</span>`;
      } else hl.textContent="Forecast data could not be loaded.";
      if(S.level==="national"){
        body.innerHTML=`<h1>Ukraine heatwave hazard</h1><div class="muted">${S.mode==="live"?"Live Open-Meteo forecast":S.mode==="historical"?"Observed ERA5-Land replay":"Synthetic simulation"} · event footprint, not raw temperature.</div>`;
        const r=(window.__natRank||[]).slice().sort(rankCmp).slice(0,8);
        if(S.mode==="historical"){ rank.innerHTML=`<div class="muted" style="margin-top:8px">Observed footprint for ${S.date}. Use the timeline to replay the event.</div>`; }
        else { rank.innerHTML=`<label class="blk">${(window.__natRank||[]).some(p=>p.severity_level>=2)?"Highest hazard":"Heatwave watch"} on ${S.date}</label><div class="list" id="ranklist"></div>`;
          fillRank(r,(p)=>{if(cityRegistry[p.city]&&cityRegistry[p.city].has_regions)userActivateCity(p.city);else{flyTo(p.lat,p.lon,9);cellPopupCity(p);}}); }
      } else if(cityRiskError){body.innerHTML="";rank.innerHTML="";document.getElementById("detail").style.display="none";
      } else {
        const meta=window.__cityMeta||{}, cn=cityRegistry[S.city]?cityRegistry[S.city].name_en:S.city;
        body.innerHTML=`<h1>${cn}</h1><div class="muted">Districts · ${meta.total_cells_sampled||0} forecast cells sampled</div><div class="warnrow">${meta.resolution_note||"District-level estimated heat distribution. Forecast resolution does not represent street-level temperature."}</div>`;
        const regs=(window.__regions||[]).filter(r=>!r.error).slice().sort((a,b)=>(b.severity_level-a.severity_level)||((b.tmax_minus_tx95??-99)-(a.tmax_minus_tx95??-99)));
        rank.innerHTML=`<details open><summary>District ranking (${regs.length})</summary><div class="list" id="ranklist"></div></details>`;
        fillRankDistricts(regs);
        if(S.region)showDistrict(S.region);
      }
      document.getElementById("openProfile").textContent=S.region?`Check personal risk in ${regionName(S.region)} →`:"Check my personal risk →";
    }
    function rankCmp(a,b){ return (b.severity_level-a.severity_level)||(b.tx95_run-a.tx95_run)||((b.value??-99)-(a.value??-99))||((b.consecutive_tropical_nights||0)-(a.consecutive_tropical_nights||0)); }
    function fillRank(items,onClick){const box=document.getElementById("ranklist");if(!box)return;box.innerHTML="";
      items.forEach(p=>{const row=document.createElement("div");row.className="row";row.tabIndex=0;row.setAttribute("role","button");
        const l=p.severity_level||0; const day=l>=2?`Day ${p.tx90_run}`:l===1?"Watch":"—";
        const exc=p.value!=null?`Max ${p.value>0?"+":""}${p.value}°C vs TX95`:"";
        const tn=p.consecutive_tropical_nights?` · ${p.consecutive_tropical_nights} tropical night(s)`:"";
        row.setAttribute("aria-label",`${p.name_en}, Level ${l} ${LEVELS[l]}`);
        row.innerHTML=`<div><div>${p.name_en}</div><div class="sub">${exc||day}${exc&&day!=="—"?" · "+day:""}${tn}</div></div>${lvpill(l,true)}`;
        row.onclick=()=>onClick(p);row.onkeydown=e=>{if(e.key==="Enter")onClick(p);};box.appendChild(row);});}
    function fillRankDistricts(regs){const box=document.getElementById("ranklist");if(!box)return;box.innerHTML="";
      regs.forEach(r=>{const row=document.createElement("div");row.className="row"+(r.id===S.region?" sel":"");row.tabIndex=0;row.setAttribute("role","button");
        const l=r.severity_level||0;
        row.setAttribute("aria-label",`${r.name_en}, Level ${l} ${LEVELS[l]}`);
        row.innerHTML=`<div><div>${r.name_en}</div><div class="sub">${r.pct_level2plus||0}% confirmed · peak L${r.max_severity_level??l}</div></div>${lvpill(l,true)}`;
        row.onclick=()=>userSelectRegion(r.id);row.onkeydown=e=>{if(e.key==="Enter")userSelectRegion(r.id);};box.appendChild(row);});}
    function renderLegend(){const L=document.getElementById("legend");
      L.innerHTML=[0,1,2,3,4].map(l=>`<div><i style="background:${COLORS[l]}"></i><b>${l}</b> ${LEVELS[l]}</div>`).join("")+
        `<div style="margin-top:3px"><i style="background:#c0161c;opacity:.55"></i> tropical night (layer)</div>`;}

    // =============== popups ===============
    function cellPopup(p,lngLat){const box=document.getElementById("detail");box.style.display="block";
      const l=p.severity_level||0;
      const tnLine = p.tropical_night===true?"Yes — Tmin exceeds 20 °C and/or local TN90":
                     `No tropical night: Tmin ${p.tmin ?? "–"} °C, local TN90 ${p.tn90 ?? "–"} °C`;
      const state = l===0?"No heatwave detected at this location for the selected date.":l===1?"Heatwave watch — unusually hot, but persistence criteria are not yet met.":`${LEVELS[l]} — Level ${l}.`;
      box.innerHTML=`<span class="close" onclick="this.parentNode.style.display='none'">✕</span>`+
        `<b>${state}</b> ${lvpill(l)}`+
        `<table>
          <tr><td>Max temperature</td><td>${p.tmax ?? "–"} °C</td></tr>
          <tr><td>Local TX90 / TX95</td><td>${p.tx90 ?? "–"} / ${p.tx95 ?? "–"} °C</td></tr>
          <tr><td>TX90 / TX95 exceedance</td><td>${fmt(p.tx90_exceedance)} / ${fmt(p.tx95_exceedance)} °C</td></tr>
          <tr><td>Consecutive TX90 / TX95 days</td><td>${p.tx90_run ?? 0} / ${p.tx95_run ?? 0}</td></tr>
          <tr><td>Event</td><td>${p.event_start? p.event_start+"→"+(p.event_end||"?"):"—"}</td></tr>
          <tr><td>Tropical night</td><td style="max-width:170px;white-space:normal">${tnLine}</td></tr>
        </table>`+
        `<div class="foot"><b>Reasons:</b> ${(p.reasons||[]).join(" ")}</div>`+
        `<div class="foot">Data: ${S.mode==="live"?"Live Open-Meteo forecast":S.mode==="historical"?"Observed ERA5-Land":"Synthetic simulation"} · ${footprintData?footprintData.resolution_note||"":""}</div>`;
    }
    function cellPopupCity(p){cellPopup({severity_level:p.severity_level,tmax:p.tmax,tmin:p.tmin,tx90:p.thresholds?.tx90,tx95:p.thresholds?.tx95,tn90:p.thresholds?.tn90,tx90_exceedance:p.thresholds?.tx90!=null&&p.tmax!=null?+(p.tmax-p.thresholds.tx90).toFixed(2):null,tx95_exceedance:p.value,tx90_run:p.tx90_run,tx95_run:p.tx95_run,tropical_night:p.tropical_night,reasons:p.reasons});}
    const fmt=(v)=>v==null?"–":(v>0?"+":"")+v;
    function showDistrict(id){const r=(window.__regions||[]).find(x=>x.id===id);if(!r)return;highlightRegion(id);
      const box=document.getElementById("detail");box.style.display="block";
      if(r.error){box.innerHTML=`<span class="close" onclick="this.parentNode.style.display='none'">✕</span><b>${r.name_en}</b><div class="muted">forecast unavailable</div>`;return;}
      const l=r.severity_level||0;
      box.innerHTML=`<span class="close" onclick="this.parentNode.style.display='none'">✕</span>`+
        `<b>${r.name} / ${r.name_en}</b> ${lvpill(l)}`+
        `<div class="muted">${r.severity_statistic||"district hazard"} · ${r.n_cells} cell(s)${r.from_centroid?" · ⚠ centroid fallback":""} · ${r.data_status}</div>`+
        `<table>
          <tr><td>Affected cells ≥ confirmed</td><td>${r.pct_level2plus}%</td></tr>
          <tr><td>Max / mean / p90 level</td><td>${r.max_severity_level} / ${r.mean_severity_level} / ${r.p90_severity_level}</td></tr>
          <tr><td>Tmax mean / max / p90</td><td>${r.tmax_mean} / ${r.tmax_max} / ${r.tmax_p90} °C</td></tr>
          <tr><td>Hottest sampled cell</td><td>${r.hottest_cell_tmax} °C</td></tr>
          <tr><td>TX90 / TX95</td><td>${r.tx90} / ${r.tx95} °C</td></tr>
          <tr><td>Tmax − TX95</td><td>${fmt(r.tmax_minus_tx95)} °C</td></tr>
          <tr><td>Tropical night</td><td>${r.tropical_night?"🌙 yes":"no"}</td></tr>
        </table>`+
        `<div class="foot">${r.pct_level2plus}% of sampled district cells are in a confirmed heatwave. Max district level: ${r.max_severity_label}.</div>`+
        `<div class="foot"><b>Why:</b> ${(r.reasons||[]).join(" ")} · ${(window.__cityMeta||{}).resolution_note||""}</div>`+
        `<button class="btn" onclick="window.__cityProfile('${r.id}')">Check my personal risk here →</button>`;
    }

    // =============== timeline ===============
    function formatTimelineDate(dt){if(!dt)return "—";return new Intl.DateTimeFormat("en",{month:"short",day:"numeric",year:"numeric",timeZone:"UTC"}).format(new Date(`${dt}T00:00:00Z`));}
    function currentTimelineIndex(){const idx=availableDates.indexOf(S.date);return idx<0?0:idx;}
    function syncPlayButton(){const button=document.getElementById("tlbtn"),timeline=document.getElementById("timeline");
      button.textContent=playing?"⏸":"▶";button.setAttribute("aria-label",playing?"Pause timeline":"Play timeline");button.setAttribute("aria-pressed",String(playing));timeline.dataset.playing=String(playing);}
    function stopPlayback(){playing=false;clearTimeout(playTimer);playTimer=null;syncPlayButton();}
    function goToTimelineIndex(next,{pause=true}={}){if(!availableDates.length)return;if(pause)stopPlayback();
      const idx=Math.max(0,Math.min(availableDates.length-1,next));setState({date:availableDates[idx]},{push:false});}
    function renderTimeline(){const range=document.getElementById("tlrange"),markers=document.getElementById("tlmarkers"),current=document.getElementById("tlcurrent"),kind=document.getElementById("tlkind"),end=document.getElementById("tlend"),status=document.getElementById("tlstatus");
      if(!availableDates.length){current.textContent="Unavailable";end.textContent="";status.textContent="No dates available";range.disabled=true;markers.innerHTML="";return;}
      const idx=currentTimelineIndex(),last=availableDates.length-1,lvlByDate=window.__tlLevels||{},level=lvlByDate[S.date];
      range.disabled=availableDates.length<2;range.max=String(last);range.value=String(idx);
      range.style.setProperty("--progress",`${last?idx/last*100:0}%`);
      const dateContext=S.mode==="historical"?"Observed":S.mode==="synthetic"?"Simulation":"Forecast";
      range.setAttribute("aria-label",`${dateContext} date`);range.setAttribute("aria-valuetext",`${dateContext} ${formatTimelineDate(S.date)}${level!=null?`, heatwave level ${level}`:""}`);
      document.getElementById("timeline").setAttribute("aria-label",`${dateContext} timeline`);
      kind.textContent=`${dateContext} date`;current.textContent=formatTimelineDate(S.date);end.textContent=`${S.mode==="live"?"Forecast ends":"Ends"} ${formatTimelineDate(availableDates[last])}`;
      markers.innerHTML=availableDates.map((dt,i)=>{const lv=lvlByDate[dt];if(lv==null)return "";const pos=last?i/last*100:0;return `<i class="tlmarker" style="left:${pos}%;background:${COLORS[lv]}" title="${dt} · Level ${lv}"></i>`;}).join("");
      if(S.mode==="historical"&&summaryData&&summaryData.event){const e=summaryData.event;
        status.textContent=`ERA5-Land event ${e.start_date}–${e.end_date} · Day ${idx+1} of ${availableDates.length} · Level ${level??0} · ${e.duration_days} days · Maximum level ${e.maximum_severity_level}`;
      }else if(S.mode==="live")status.textContent=`Forecast day ${idx+1} of ${availableDates.length}`;
      else status.textContent=`Simulation day ${idx+1} of ${availableDates.length}${level!=null?` · Level ${level}`:""}`;
      syncPlayButton();
    }
    function togglePlay(){if(!availableDates.length)return;if(playing){stopPlayback();return;}
      if(currentTimelineIndex()>=availableDates.length-1){stopPlayback();return;}
      playing=true;syncPlayButton();step();}
    async function step(){if(!playing)return;const idx=currentTimelineIndex();
      if(idx>=availableDates.length-1){stopPlayback();return;}
      await setState({date:availableDates[idx+1]},{push:false});
      if(idx+1>=availableDates.length-1){stopPlayback();return;}
      playTimer=setTimeout(step,900/playbackRate);}

    // =============== historical events ===============
    async function loadHistoricalEvents(){ try{const d=await jget(`${API}/api/historical-events?minimum_level=3&limit=25`);
      historicalEvents=d.events||[]; defaultEvent=d.default_event_id;}catch(e){historicalEvents=[];} }
    async function selectEvent(eid){ stopPlayback();let e=historicalEvents.find(x=>x.event_id===eid);
      let start=e?e.start_date:null;
      try{const det=await jget(`${API}/api/historical-event/${eid}`);
        window.__tlLevels={}; det.timeline.forEach(t=>window.__tlLevels[t.date]=t.max_level);
        availableDates=det.dates; if(!start)start=det.dates[0]; }catch(err){}
      // MUST set mode:"historical" (this is the mode-selector entry point).
      setState({mode:"historical",event:eid,date:start||S.date},{push:true});
    }

    // =============== navigation ===============
    function flyTo(lat,lon,z){programmaticMove=true;map.flyTo({center:[lon,lat],zoom:z,duration:800});}
    function userActivateCity(id,{fit=true}={}){const selectedDate=S.date;stopPlayback();setState({city:id,region:null,date:selectedDate},{push:true,fit});}
    function goNational(){programmaticMove=true;map.flyTo({center:[31.2,48.8],zoom:5,duration:800});document.getElementById("detail").style.display="none";setState({city:null,region:null},{push:true});}
    function userSelectRegion(id){document.getElementById("detail").style.display="block";setState({region:id},{push:true});}
    map.on("moveend",()=>{if(!mapReady)return;if(programmaticMove){programmaticMove=false;return;}
      const z=map.getZoom(),c=map.getCenter();
      const inK=c.lng>=KYIV_BBOX[0]&&c.lng<=KYIV_BBOX[2]&&c.lat>=KYIV_BBOX[1]&&c.lat<=KYIV_BBOX[3];
      if(S.level==="national"&&z>=8.3&&inK&&cityRegistry.kyiv&&cityRegistry.kyiv.has_regions)userActivateCity("kyiv",{fit:false});
      else if(S.city&&z<7.2){document.getElementById("detail").style.display="none";setState({city:null,region:null},{push:true,fit:false});}});

    // =============== controls ===============
    document.querySelectorAll("#modes button").forEach(b=>b.onclick=async()=>{stopPlayback();
      if(b.dataset.m==="historical"){ if(!historicalEvents.length)await loadHistoricalEvents();
        const eid=S.event||defaultEvent; if(eid){await selectEvent(eid);return;} }
      window.__tlLevels=null; setState({mode:b.dataset.m,event:b.dataset.m==="historical"?(S.event||defaultEvent):null,date:new Date().toISOString().slice(0,10)},{push:true});});
    document.getElementById("synthetic").onchange=(e)=>{ stopPlayback();Object.keys(fpCache).forEach(k=>delete fpCache[k]); Object.keys(riskCache).forEach(k=>delete riskCache[k]);
      setState({mode:e.target.checked?"synthetic":"live",event:null,date:new Date().toISOString().slice(0,10)},{push:true});};
    document.querySelectorAll("#layers button").forEach(b=>b.onclick=()=>setState({layer:b.dataset.l},{push:false}));
    document.getElementById("tlbtn").onclick=togglePlay;
    document.getElementById("tlprev").onclick=()=>goToTimelineIndex(currentTimelineIndex()-1);
    document.getElementById("tlnext").onclick=()=>goToTimelineIndex(currentTimelineIndex()+1);
    const tlrange=document.getElementById("tlrange");
    tlrange.addEventListener("pointerdown",stopPlayback);tlrange.addEventListener("touchstart",stopPlayback,{passive:true});
    tlrange.addEventListener("input",e=>goToTimelineIndex(Number(e.target.value)));
    document.getElementById("tlspeed").onchange=e=>{playbackRate=Number(e.target.value)||1;if(playing){clearTimeout(playTimer);playTimer=setTimeout(step,900/playbackRate);}};
    document.getElementById("timeline").addEventListener("keydown",e=>{
      if(e.target.matches("select")||!e.target.matches("button,input[type=range]"))return;
      let handled=true;
      if(e.code==="Space"||e.key===" ")togglePlay();
      else if(e.key==="ArrowLeft")goToTimelineIndex(currentTimelineIndex()-1);
      else if(e.key==="ArrowRight")goToTimelineIndex(currentTimelineIndex()+1);
      else if(e.key==="Home")goToTimelineIndex(0);
      else if(e.key==="End")goToTimelineIndex(availableDates.length-1);
      else handled=false;
      if(handled)e.preventDefault();
    });
    let sTimer; const sb=document.getElementById("search"),sr=document.getElementById("searchResults");
    sb.oninput=(e)=>{clearTimeout(sTimer);const q=e.target.value.trim();if(!q){sr.innerHTML="";sb.setAttribute("aria-expanded","false");return;}
      sTimer=setTimeout(async()=>{const d=await jget(`${API}/api/cities?q=${encodeURIComponent(q)}`);sr.innerHTML="";sb.setAttribute("aria-expanded",d.cities.length?"true":"false");
        d.cities.slice(0,6).forEach(c=>{const row=document.createElement("div");row.className="row";row.tabIndex=0;row.setAttribute("role","option");
          const has=cityRegistry[c.id]&&cityRegistry[c.id].has_regions;row.innerHTML=`<span>${c.name_en}</span><span class="muted">${has?"districts":"point"}</span>`;
          const go=()=>{sr.innerHTML="";sb.setAttribute("aria-expanded","false");sb.value=c.name_en;if(has)userActivateCity(c.id);else{flyTo(c.lat,c.lon,9);toast(`District-level detail is not yet available for ${c.name_en}.`);}};
          row.onclick=go;row.onkeydown=ev=>{if(ev.key==="Enter")go();};sr.appendChild(row);});},300);};
    function toast(m){const s=document.getElementById("src");s.textContent=m;setTimeout(loadStatus,4000);}
    window.addEventListener("popstate",()=>{stopPlayback();readURL();apply({fit:true});});

    // =============== personal risk (context-aware) ===============
    const PKEY="waves_profile_v1";
    const lp=()=>{try{return JSON.parse(localStorage.getItem(PKEY))||{}}catch{return{}}};
    const spf=(p)=>localStorage.setItem(PKEY,JSON.stringify(p));
    const g=(id)=>{const el=document.getElementById(id);return el?el.checked:false;};
    let profileCtx=null,lastRiskResult=null,lastRiskContext=null,lastCheckInMessage="",lastActionPlan=null,lastActionPlanLanguage="en",checkinPollTimer=null;
    window.__cityProfile=(rid)=>{const r=(window.__regions||[]).find(x=>x.id===rid);if(!r)return;
      profileCtx={label:`${r.name_en}, ${cityRegistry[S.city].name_en} — district-level estimate`,
        env:{exceeds_tx90:(r.tmax_minus_tx90??-9)>0,exceeds_tx95:(r.tmax_minus_tx95??-9)>0,exceeds_tx99:(r.tmax_max!=null&&r.tx99!=null&&r.tmax_max>r.tx99),
          in_primary_event:(r.severity_level||0)>=2,event_duration_days:(r.severity_level||0)>=2?3:0,tropical_night:!!r.tropical_night,
          heat_index_max:r.heat_index_max,baseline_status:(window.__baseline||{}).baseline_status||"provisional",source:`district aggregate (${r.name_en}, ${S.date})`}};
      openProfile();};
    function currentCtx(){if(profileCtx)return profileCtx;
      if(S.city&&cityRegistry[S.city])return{label:`${cityRegistry[S.city].name_en} (city centre)`,lat:cityRegistry[S.city].center[0],lon:cityRegistry[S.city].center[1]};
      return{label:"Kyiv (default)",lat:50.4501,lon:30.5234};}
    function chk(id,l,c){return `<label class="chk"><input type="checkbox" id="${id}" ${c?"checked":""}/> ${l}</label>`;}
    window.openProfile=function(){const p=lp(),v=p.vulnerability||{},e=p.exposure||{},pr=p.protection||{},s=p.symptoms||{},ctx=currentCtx();
      document.getElementById("overlay").style.display="flex";
      document.getElementById("sheet").innerHTML=`<span class="close" onclick="window.__closeOverlay()">✕</span>
        <h1 style="font-size:16px">Personal heat-risk profile</h1>
        <div class="muted">Environmental context: <b>${ctx.label}</b> · ${S.date}. No account, no names — stored only in your browser.</div>
        <fieldset><legend>Emergency symptoms now</legend><div class="grid2">
          ${chk("s_conf","Confusion",s.confusion)}${chk("s_faint","Fainting / unconscious",s.loss_of_consciousness)}${chk("s_seiz","Seizure",s.seizure)}${chk("s_chest","Chest pain",s.chest_pain)}
          ${chk("s_breath","Severe breathlessness",s.severe_shortness_of_breath)}${chk("s_stroke","Stroke-like symptoms",s.stroke_like_symptoms)}${chk("s_drink","Cannot drink",s.cannot_drink)}${chk("s_weak","Severe weakness",s.severe_weakness)}
        </div></fieldset>
        <fieldset><legend>Age &amp; health (optional)</legend><label class="blk" for="age">Age band</label>
          <select id="age">${["","under_5","5_17","18_64","65_74","75_plus"].map(a=>`<option value="${a}" ${v.age_band===a?"selected":""}>${a||"prefer not to answer"}</option>`).join("")}</select>
          <div class="grid2" style="margin-top:8px">
          ${chk("v_preg","Pregnancy",v.pregnancy)}${chk("v_cvd","Cardiovascular disease",v.cardiovascular)}${chk("v_hf","Heart failure",v.heart_failure)}${chk("v_htn","Hypertension",v.hypertension)}
          ${chk("v_ckd","Chronic kidney disease",v.ckd)}${chk("v_dia","Diabetes",v.diabetes)}${chk("v_resp","Chronic respiratory disease",v.chronic_respiratory)}${chk("v_med","Medicine affecting hydration/BP",v.thermoregulation_medication)}
          ${chk("v_fluid","Prescribed fluid restriction",v.fluid_restriction)}${chk("v_mob","Limited mobility",v.limited_mobility)}${chk("v_alone","Lives alone",v.living_alone)}
          </div></fieldset>
        <fieldset><legend>Exposure</legend><div class="grid2">
          ${chk("e_work","Outdoor work",e.outdoor_work)}${chk("e_sport","Intense outdoor sport",e.intense_outdoor_sport)}${chk("e_sun","Long time in direct sun",e.direct_sun)}${chk("e_transport","Hot transport",e.hot_transport)}${chk("e_top","Top-floor / overheated home",e.top_floor_or_overheated_home)}${chk("e_night","Night-time exposure",e.nighttime_exposure)}
        </div></fieldset>
        <fieldset><legend>Protection available</legend><div class="grid2">
          ${chk("p_ac","Air conditioning",pr.air_conditioning)}${chk("p_cool","Access to a cooler place",pr.access_to_cooler_place)}${chk("p_water","Reliable water",pr.reliable_water)}${chk("p_social","Social support / check-ins",pr.social_support)}${chk("p_sched","Can change schedule",pr.can_change_schedule)}${chk("p_elec","Reliable electricity",pr.reliable_electricity)}
        </div></fieldset>
        <button class="btn" onclick="window.__submitProfile()">See my explained risk →</button>
        <button class="btn sec" onclick="window.__closeOverlay()">Cancel</button>
        <div class="foot">Not a medical diagnosis. Emergency symptoms always trigger an urgent warning.</div>`;};
    function stopCheckinPoll(){if(checkinPollTimer){clearInterval(checkinPollTimer);checkinPollTimer=null;}}
    window.__closeOverlay=()=>{stopCheckinPoll();document.getElementById("overlay").style.display="none";};
    window.__submitProfile=async function(){const ctx=currentCtx();
      const profile={vulnerability:{age_band:document.getElementById("age").value||null,pregnancy:g("v_preg"),cardiovascular:g("v_cvd"),heart_failure:g("v_hf"),hypertension:g("v_htn"),ckd:g("v_ckd"),diabetes:g("v_dia"),chronic_respiratory:g("v_resp"),thermoregulation_medication:g("v_med"),fluid_restriction:g("v_fluid"),limited_mobility:g("v_mob"),living_alone:g("v_alone")},
        exposure:{outdoor_work:g("e_work"),intense_outdoor_sport:g("e_sport"),direct_sun:g("e_sun"),hot_transport:g("e_transport"),top_floor_or_overheated_home:g("e_top"),nighttime_exposure:g("e_night"),hours_outside:g("e_work")?8:1},
        protection:{air_conditioning:g("p_ac"),access_to_cooler_place:g("p_cool"),reliable_water:g("p_water"),social_support:g("p_social"),can_change_schedule:g("p_sched"),reliable_electricity:g("p_elec")},
        symptoms:{confusion:g("s_conf"),loss_of_consciousness:g("s_faint"),seizure:g("s_seiz"),chest_pain:g("s_chest"),severe_shortness_of_breath:g("s_breath"),stroke_like_symptoms:g("s_stroke"),cannot_drink:g("s_drink"),severe_weakness:g("s_weak")}};
      spf(profile);
      if(ctx.env)profile.environment=ctx.env; else {profile.latitude=ctx.lat;profile.longitude=ctx.lon;profile.date=S.date;}
      let d;try{d=await (await fetch(`${API}/api/profile-risk?scenario=${S.mode==="synthetic"?"heatwave":""}`,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(profile)})).json();}
      catch(err){document.getElementById("sheet").innerHTML=`<span class="close" onclick="window.__closeOverlay()">✕</span><p>Could not reach the risk service.</p>`;return;}
      renderResult(d,ctx.label);};
    const esc=(value)=>String(value??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]);
    function renderResult(d,ctxLabel){stopCheckinPoll();lastActionPlan=null;lastRiskResult=d;lastRiskContext=ctxLabel;const sheet=document.getElementById("sheet");let h=`<span class="close" onclick="window.__closeOverlay()">✕</span><div class="muted" style="margin-bottom:6px">Environmental context: <b>${ctxLabel}</b></div>`;
      if(d.emergency&&d.emergency.active){h+=`<div class="emerg"><b>⚠ EMERGENCY — call 103</b><p>${d.emergency.message_en}</p><div style="font-size:12px">Reported: ${d.emergency.symptoms.join(", ").replace(/_/g," ")}</div></div>`;}
      else{h+=`<h1 style="font-size:16px">Your heat-risk: <span class="lvpill" style="background:${({low:"#4a90c2",moderate:"#e0a300",high:"#e2681c",critical:"#c0161c"})[d.category]}">${d.category.toUpperCase()}</span></h1>
        <div class="muted">Confidence: ${d.confidence}. ${d.protection_applied?"Protective factors lowered this by one level.":""}</div>
        <h3 style="font-size:13px;margin:12px 0 4px">Top reasons increasing risk</h3>${(d.top_reasons.length?d.top_reasons:[{detail:"No specific escalating factors."}]).map(r=>`<div class="reason">• ${r.detail}</div>`).join("")}
        ${d.protective_factors.length?`<h3 style="font-size:13px;margin:12px 0 4px">Protective factors you have</h3><div class="muted">${d.protective_factors.join(", ").replace(/_/g," ")}</div>`:""}`;}
      if(d.guardrails.length)h+=`<h3 style="font-size:13px;margin:12px 0 4px">Important safety notes</h3>`+d.guardrails.map(x=>`<div class="reason" style="color:#a15c00">⚠ ${x.en}</div>`).join("");
      if(d.recommendations.length)h+=`<h3 style="font-size:13px;margin:12px 0 4px">Recommended actions</h3>`+d.recommendations.map(r=>`<div class="reason">✓ ${r.en} <span class="muted">(${r.source_org||"src"}, ${r.source_date||""})</span></div>`).join("");
      if(!(d.emergency&&d.emergency.active))h+=`<div class="mistral-cta"><div class="mistral-row"><label class="blk" for="mistral-language">Plan language<select id="mistral-language" style="display:block;width:100%;margin-top:3px"><option value="en">English</option><option value="uk">Українська</option></select></label><button id="mistral-build" class="btn" onclick="window.__buildActionPlan()">Build my 12-hour action plan with Mistral</button></div><div class="foot">Waves calculates your risk. Mistral turns it into an actionable schedule.</div><div class="foot">Live forecast → Waves risk engine → Mistral Medium 3.5</div><div id="mistral-output" aria-live="polite"></div></div>`;
      h+=`<div class="foot">${d.disclaimer_en} · rule engine v${d.rule_engine_version}</div><button class="btn sec" onclick="window.openProfile()">Edit profile</button>`;sheet.innerHTML=h;}
    window.__buildActionPlan=async function(){
      if(!lastRiskResult||lastRiskResult.emergency&&lastRiskResult.emergency.active)return;
      const button=document.getElementById("mistral-build"),output=document.getElementById("mistral-output"),language=document.getElementById("mistral-language").value;
      button.disabled=true;button.textContent=language==="uk"?"Створюємо план…":"Building your plan…";output.innerHTML=`<div class="muted" style="margin-top:9px">${language==="uk"?"Mistral організовує ваші наявні рекомендації…":"Mistral is organizing your existing recommendations…"}</div>`;
      const payload={risk_category:lastRiskResult.category,confidence:lastRiskResult.confidence,top_reasons:lastRiskResult.top_reasons,protective_factors:lastRiskResult.protective_factors,recommendations:lastRiskResult.recommendations,guardrails:lastRiskResult.guardrails,context_label:lastRiskContext,date:S.date,preferred_language:language};
      try{const response=await fetch(`${API}/api/mistral-action-plan`,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(payload)}),body=await response.json();if(!response.ok)throw new Error(body.message||"Mistral unavailable");if(body.risk_category!==lastRiskResult.category)throw new Error("The generated plan did not preserve the Waves risk category.");renderActionPlan(body.plan,language);}
      catch(error){output.innerHTML=`<div class="mistral-error">${esc(error.message||"Mistral could not build a plan. Your Waves result is still available.")}</div>`;}
      finally{button.disabled=false;button.textContent="Build my 12-hour action plan with Mistral";}
    };
    function renderActionPlan(plan,language){const output=document.getElementById("mistral-output"),labels=language==="uk"?{now:"Зараз",six:"Наступні 6 годин",tonight:"Сьогодні ввечері",avoid:"Уникайте",check:"Повідомлення для перевірки стану",copy:"Копіювати",safety:"Примітка з безпеки"}:{now:"Now",six:"Next 6 hours",tonight:"Tonight",avoid:"Avoid",check:"Check-in message",copy:"Copy",safety:"Safety note"};
      const section=(title,items)=>`<h3>${title}</h3><ul>${(items||[]).map(item=>`<li>${esc(item)}</li>`).join("")}</ul>`;stopCheckinPoll();lastActionPlan=plan;lastActionPlanLanguage=language;lastCheckInMessage=plan.check_in_message||"";
      output.innerHTML=`<div class="mistral-plan"><div class="muted"><b>Generated by Mistral Medium 3.5</b></div><h2>${esc(plan.headline)}</h2>${section(labels.now,plan.immediate_actions)}${section(labels.six,plan.next_six_hours)}${section(labels.tonight,plan.tonight)}${section(labels.avoid,plan.avoid)}<h3>${labels.check}</h3><div class="check-in">${esc(lastCheckInMessage)}</div><button class="btn sec copy-btn" onclick="window.__copyCheckIn(this)">${labels.copy}</button><h3>${labels.safety}</h3><div class="muted">${esc(plan.safety_note)}</div><div class="family-checkin"><button id="send-sms-alert" class="btn sms-btn" onclick="window.__sendSmsAlert()">Send SMS alert</button><div id="checkin-card" aria-live="polite"></div></div></div>`;}
    window.__copyCheckIn=async function(button){try{await navigator.clipboard.writeText(lastCheckInMessage);button.textContent="✓";}catch(error){button.textContent="Copy failed";}};
    function checkinMessage(id){const risk=lastRiskResult.category,action=String(lastActionPlan?.immediate_actions?.[0]||lastActionPlan?.headline||"").replace(/[.!?…]+$/u,"");const link=`https://waves-nine-gold.vercel.app/checkin/${id}`;
      if(lastActionPlanLanguage==="uk"){const levels={low:"НИЗЬКИЙ",moderate:"ПОМІРНИЙ",high:"ВИСОКИЙ",critical:"КРИТИЧНИЙ"};return `Waves показує ${levels[risk]} рівень ризику спеки. Будь ласка, перевірте мій стан; перша дія: ${action} — ${link}`;}
      return `Waves shows a ${risk.toUpperCase()} heat-risk level. Please check in with me; first action: ${action} — ${link}`;}
    async function pollCheckin(id){try{const response=await fetch(`${API}/api/checkin/${encodeURIComponent(id)}/status`);if(!response.ok)return;const data=await response.json();if(data.status==="pending")return;stopCheckinPoll();const card=document.getElementById("checkin-card");if(!card)return;const stamp=new Intl.DateTimeFormat(lastActionPlanLanguage==="uk"?"uk-UA":"en-US",{hour:"numeric",minute:"2-digit"}).format(new Date());card.className=`checkin-card ${data.status}`;card.textContent=`${data.status==="ok"?"Checked in — I'm OK":"Requested help"} · ${stamp}`;}catch(error){}}
    window.__openSms=window.__openSms||((url)=>{window.location.href=url;});
    window.__sendSmsAlert=async function(){const button=document.getElementById("send-sms-alert"),card=document.getElementById("checkin-card");if(!button||!card||!lastRiskResult||!lastActionPlan)return;button.disabled=true;
      try{const response=await fetch(`${API}/api/checkin/create`,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({risk_level:lastRiskResult.category,language:lastActionPlanLanguage})}),data=await response.json();if(!response.ok||!data.id)throw new Error("Could not create check-in");stopCheckinPoll();card.className="checkin-card pending";card.textContent="Waiting for check-in…";checkinPollTimer=setInterval(()=>pollCheckin(data.id),3000);window.__openSms(`sms:+13417669597?body=${encodeURIComponent(checkinMessage(data.id))}`);}
      catch(error){card.className="checkin-card error";card.textContent="Could not start check-in.";button.disabled=false;}};
    document.getElementById("openProfile").onclick=()=>{profileCtx=null;if(S.region)window.__cityProfile(S.region);else openProfile();};

    // =============== boot ===============
    map.on("load",async()=>{ readURL();
      try{const av=await jget(`${API}/api/cities-available`);av.cities.forEach(c=>cityRegistry[c.id]=c);}catch(e){}
      await loadStatus();
      if(S.mode==="historical"){ await loadHistoricalEvents(); if(!S.event)S.event=defaultEvent;
        if(S.event){try{const det=await jget(`${API}/api/historical-event/${S.event}`);window.__tlLevels={};det.timeline.forEach(t=>window.__tlLevels[t.date]=t.max_level);availableDates=det.dates;if(!S.date)S.date=det.dates[0];}catch(e){}} }
      mapReady=true;
      window.__waves={getState:()=>({...S}),regions:()=>(window.__regions||[]),ready:false,
        mapCount:()=>document.querySelectorAll(".maplibregl-canvas").length,summary:()=>summaryData,
        footprintDate:()=>footprintData&&footprintData.date,isPlaying:()=>playing,dates:()=>availableDates.slice(),
        districtFeatures:()=>districtGeoJSON?districtGeoJSON.features.slice():[]};
      await apply({fit:!!S.city});
      window.__waves.ready=true;
    });
  })();
  </script>
</body>
